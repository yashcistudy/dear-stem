<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dear stem · the shop</title>
<link rel="icon" href="vendor/monogram_plum.svg" type="image/svg+xml">
<style>
@font-face{font-family:Jost;font-weight:300;src:url(vendor/jost-latin-300-normal.woff2) format('woff2')}
@font-face{font-family:Jost;font-weight:400;src:url(vendor/jost-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Jost;font-weight:500;src:url(vendor/jost-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Homemade Apple';src:url(vendor/homemade-apple-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Caffe Latte';src:url(vendor/caffe-latte.woff2) format('woff2')}
:root{--paper:#FBF8F3;--plum:#3A2233;--ink2:#6B5463;--petal:#F1B9C4;--butter:#F2D98B;--lilac:#C3B3E0;--blue:#7E9CCB;--mint:#BFD8C2;--line:rgba(58,34,51,.16)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--plum);font-family:Jost,sans-serif;overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
#stage{position:fixed;inset:0}
canvas{display:block}
header{position:fixed;left:0;right:0;top:0;z-index:5;background:var(--paper)}
.rail{height:10px;background:url(vendor/rail.svg) center/100% 100% no-repeat}
.rule{height:6px;background:url(vendor/rule.svg) center/100% 100% no-repeat}
.thr{width:8px;background:url(vendor/thread.svg) center/100% 100% no-repeat}
.hook{width:20px;height:26px;background:url(vendor/hook.svg) center top/contain no-repeat}
.frame{border:7px solid transparent;border-image:url(vendor/box.svg) 9 stretch}
.hd{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 28px 6px}
.hd img{height:44px;display:block}
.hd .right{display:flex;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--plum);padding:8px 12px;min-height:44px;font-size:14px}
.toggle{display:inline-flex;align-items:center;gap:10px;background:transparent;border:0;font-size:14px;min-height:44px}
.sw{width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--paper);transition:left .2s}
.toggle[aria-checked=true] .sw{background:var(--plum)}
.toggle[aria-checked=true] .sw::after{left:21px}
.btn{background:var(--plum);color:var(--paper);border:1.5px solid var(--plum);font-weight:500;font-size:16px;min-height:50px;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--paper);color:var(--plum)}
.q{font-family:'Homemade Apple',cursive;line-height:1.5;margin:0}
.ct{font-family:'Caffe Latte',serif;font-weight:400;margin:0;line-height:1.05;white-space:nowrap}
.lab{font-size:13px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;margin:0}
.muted{color:var(--ink2)}
/* side panel */
#panel{position:fixed;z-index:6;top:96px;right:24px;width:400px;height:auto;max-height:calc(100% - 130px);overflow:auto;background:transparent;padding:0;transform:translateX(440px);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#panel.open{transform:none}
#panel .tie{display:flex;flex-direction:column;align-items:center;position:absolute;left:50%;top:-58px;margin-left:-10px}
#panel .in{position:relative;padding:22px 24px 24px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);background:var(--paper)}
#panel .close{position:absolute;right:10px;top:8px;border:0;background:transparent;font-size:26px;width:44px;height:44px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{background:#fff;border:1px solid var(--line);min-height:62px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:2px}
.opt[aria-checked=true]{background:var(--petal);border:7px solid transparent;border-image:url(vendor/box.svg) 9 stretch;padding:2px}
.opt b{font-weight:500;font-size:15px}.opt span{font-size:12px;color:var(--ink2)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--plum)}
.seg button{border:0;min-height:46px;background:#fff;font-size:15px}
.seg button[aria-checked=true]{background:var(--plum);color:var(--paper);font-weight:500}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
label.f input{font-family:inherit;font-size:17px;color:var(--plum);background:#fff;border:1px solid var(--plum);padding:10px 12px;min-height:48px}
.thumbs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.thumbs img{width:100%;aspect-ratio:4/5;object-fit:cover;border:1px solid var(--line);display:block}
/* hint + tag */
#hint{position:fixed;z-index:4;left:50%;bottom:26px;transform:translateX(-50%);background:var(--paper);border:1px solid var(--plum);padding:10px 16px;font-size:15px;display:none;align-items:center;gap:10px}
#tag{position:fixed;z-index:4;pointer-events:none;display:none;flex-direction:column;align-items:center}
#tag .t{background:var(--paper);border:1px solid var(--plum);padding:10px 14px;margin-top:-12px;text-align:center;min-width:150px}
#tag .t b{display:block;font-weight:500;font-size:16px}
#tag .t span{font-size:13px;color:var(--ink2)}
/* simple view */
#simple{position:fixed;inset:0;z-index:3;overflow:auto;background:var(--paper);padding:110px 28px 60px;display:none}
#simple .grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 20px}
#simple .cell{display:flex;flex-direction:column;align-items:center}
#simple article{background:#fff;border:1px solid var(--line);width:100%;margin-top:-12px;text-align:left}
#simple article img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
#simple article div{padding:14px 16px 18px;display:flex;flex-direction:column;gap:6px}
#simple h3{margin:0;font-size:18px;font-weight:500}
#credits{position:fixed;z-index:4;left:20px;bottom:16px;font-size:12px;color:var(--ink2);background:rgba(251,248,243,.85);padding:4px 8px}
#credits a{color:var(--plum)}
@media (max-width:720px){
 .hd{padding:6px 14px}.hd img{height:34px}.chip .full{display:none}
 #panel{left:10px;right:10px;width:auto;top:auto;bottom:10px;max-height:72%;transform:translateY(110%)}
 #panel.open{transform:none}
 #simple{padding:96px 16px 40px}#simple .grid{grid-template-columns:1fr}
 .opts{grid-template-columns:repeat(3,1fr)}
}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}
ul.credits{margin:0;padding-left:18px;font-size:13px;line-height:1.55}ul.credits a{color:var(--plum,#3A2233)}

/* standpoints */
#stage canvas{touch-action:none;cursor:grab}#stage canvas:active{cursor:grabbing}
#fade{position:fixed;inset:0;z-index:2;background:var(--paper);opacity:1;pointer-events:none;transition:opacity .32s ease}
.hot{position:fixed;z-index:3;transform:translate(-11px,-50%);display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;font:inherit;color:var(--plum)}
.hot i{width:18px;height:18px;border-radius:50%;background:var(--paper);border:2px solid var(--plum);box-shadow:0 0 0 6px rgba(251,248,243,.5);flex:none}
.hot.go i{background:var(--plum);box-shadow:0 0 0 6px rgba(251,248,243,.6)}
.hot b{font-weight:500;font-size:14px;background:var(--paper);padding:6px 10px;border:1px solid var(--plum);opacity:0;transform:translateX(-4px);transition:.2s;white-space:nowrap}
.hot:hover b,.hot:focus-visible b,body.touch .hot b{opacity:1;transform:none}
#here{position:fixed;z-index:3;left:20px;top:96px;display:flex;align-items:center;gap:10px}
#here .back{background:var(--paper);border:1px solid var(--plum);min-height:44px;padding:0 14px;font-size:14px;display:none;align-items:center}
#simple .ph{aspect-ratio:3/2;overflow:hidden}#simple .ph img{width:100%;height:100%;object-fit:cover;display:block}
#here .lab{background:rgba(251,248,243,.88);padding:6px 10px}
#dragtip{position:fixed;z-index:3;left:50%;bottom:26px;transform:translateX(-50%);background:var(--paper);border:1px solid var(--line);padding:8px 14px;font-size:14px}
@media (max-width:720px){#here{top:84px;left:12px}}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body>
<header>
 <div class="rail"></div>
 <div class="hd">
  <img src="vendor/logo-one-line_plum.svg" alt="dear stem">
  <div class="right">
   <button class="chip" id="chip" type="button"><span aria-hidden="true">⌖</span><span id="chipText">where to?</span></button>
   <button class="toggle" id="viewToggle" role="switch" aria-checked="false" type="button"><span class="sw" aria-hidden="true"></span><span>Simple view</span></button>
  </div>
 </div>
 <div class="rule"></div>
</header>
<div id="stage" aria-label="Photos of the dear stem shop. Drag to look around and choose a spot, or switch to the simple view."></div>
<div id="fade"></div>
<div id="here"><button class="back" id="back" type="button">← Back to the door</button><span class="lab" id="hereT"></span></div>
<div id="dragtip">Drag to look around</div>
<div id="hint"><span class="q" style="font-size:15px">Tap anything in the shop.</span></div>
<aside id="panel" aria-live="polite"><div class="tie"><div class="thr" style="height:44px"></div><div class="hook"></div></div><div class="in" id="panelIn"></div></aside>
<section id="simple" aria-label="Simple view"><div class="grid" id="simpleGrid"></div></section>
<div id="credits">A concept shop. Photos made with AI image tools. <a href="3d/">3D room version</a></div>

<script type="module">
import * as THREE from 'three';
if(matchMedia('(hover:none)').matches) document.body.classList.add('touch');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- standpoints: one photo + one depth map each ----------
// u,v place a dot on the photo (0 to 1 from the top left). go = walk to another standpoint, zone = open a panel
const STANDS = {
  door:    {title:'Inside the door', img:'stand/stand_01_entrance.jpg', depth:'stand/stand_01_depth.png', fov:112, ready:true,
            hots:[{u:.2,v:.66,t:'The cooler',go:'cooler',zone:'cooler'},{u:.47,v:.5,t:'The counter',go:'counter',zone:'counter'},
                  {u:.8,v:.42,t:'The wrap station',go:'wrap',zone:'wrap'},{u:.65,v:.5,t:'When and where',zone:'door'},{u:.76,v:.66,t:'The café',zone:'cafe'}]},
  cooler:  {title:'The cooler', img:'stand/stand_02_cooler.jpg', depth:'stand/stand_02_depth.png', fov:108, ready:true,
            hots:[{u:.49,v:.62,t:'Ready bouquets',zone:'cooler'},{u:.5,v:.34,t:'Vases and extras',zone:'shelf'},{u:.82,v:.5,t:'The counter',go:'counter',zone:'counter'}]},
  counter: {title:'The counter', img:'stand/stand_03_counter.jpg', depth:'stand/stand_03_depth.png', fov:104, ready:true,
            hots:[{u:.66,v:.56,t:'Ask the counter',zone:'counter'},{u:.31,v:.5,t:'Pastries and coffee',zone:'cafe'},{u:.82,v:.5,t:'When and where',zone:'door'},{u:.14,v:.46,t:'The cooler',go:'cooler',zone:'cooler'}]},
  wrap:    {title:'The wrap station', img:'stand/stand_04_wrap.jpg', depth:'stand/stand_04_depth.png', fov:104, ready:true,
            hots:[{u:.78,v:.56,t:'Build your own',zone:'wrap'},{u:.72,v:.3,t:'The ribbon wall',zone:'wrap'},{u:.28,v:.6,t:'The café',zone:'cafe'},{u:.38,v:.46,t:'When and where',zone:'door'}]}
};

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('stage').appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xFBF8F3);
const camera = new THREE.PerspectiveCamera(62,1,0.05,50);
const loadImg = src => new Promise((res,rej)=>{const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src});
const cache = {};
async function build(id){
  if(cache[id]) return cache[id];
  const s = STANDS[id], [photo,dimg] = await Promise.all([loadImg(s.img),loadImg(s.depth)]);
  const c = document.createElement('canvas'); c.width=dimg.width; c.height=dimg.height; const g=c.getContext('2d'); g.drawImage(dimg,0,0);
  const dd = g.getImageData(0,0,c.width,c.height).data;
  const TH = Math.tan(s.fov*Math.PI/360), TV = TH/(photo.width/photo.height);
  const depthAt = (u,v)=>{ const x=Math.min(c.width-1,Math.max(0,Math.round(u*(c.width-1)))), y=Math.min(c.height-1,Math.max(0,Math.round(v*(c.height-1)))); return dd[(y*c.width+x)*4]/255 };
  // white = near (1.4 m), black = far (about 7 m)
  const point = (u,v)=>{ const d=1.4+Math.pow(1-depthAt(u,v),1.15)*5.6; return new THREE.Vector3((u*2-1)*TH*d,(1-2*v)*TV*d,-d) };
  const geo = new THREE.PlaneGeometry(1,1,240,160), p=geo.attributes.position, uv=geo.attributes.uv;
  for(let i=0;i<p.count;i++){ const q=point(uv.getX(i),1-uv.getY(i)); p.setXYZ(i,q.x,q.y,q.z) }
  geo.computeBoundingSphere();
  const tex = new THREE.Texture(photo); tex.colorSpace=THREE.SRGBColorSpace; tex.anisotropy=8; tex.needsUpdate=true;
  const mesh = new THREE.Mesh(geo,new THREE.MeshBasicMaterial({map:tex}));
  cache[id] = {mesh, hots:s.hots.map(h=>Object.assign({},h,{p3:point(h.u,h.v)}))};
  return cache[id];
}

// ---------- looking: drag leans and turns your head a little ----------
let t={x:0,y:0}, cur={x:0,y:0}, hov={x:0,y:0}, drag=null, walking=false;
const el = renderer.domElement;
el.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,moved:0}; el.setPointerCapture(e.pointerId); document.getElementById('dragtip').style.display='none'});
el.addEventListener('pointermove',e=>{ hov.x=e.clientX/innerWidth*2-1; hov.y=e.clientY/innerHeight*2-1; if(!drag) return;
  t.x=Math.max(-1,Math.min(1,t.x-(e.clientX-drag.x)/innerWidth*2.2)); t.y=Math.max(-1,Math.min(1,t.y-(e.clientY-drag.y)/innerHeight*2)); drag.x=e.clientX; drag.y=e.clientY });
el.addEventListener('pointerup',()=>drag=null);
addEventListener('keydown',e=>{ if(panel.classList.contains('open')) return; if(e.key==='ArrowLeft') t.x=Math.max(-1,t.x-0.15); if(e.key==='ArrowRight') t.x=Math.min(1,t.x+0.15) });

// ---------- dots on the photo ----------
let here=null, dots=[];
const fade=document.getElementById('fade'), back=document.getElementById('back'), hereT=document.getElementById('hereT');
function placeDots(st){
  dots.forEach(d=>d.el.remove());
  dots = st.hots.map(h=>{ const canGo = h.go && STANDS[h.go].ready; const b=document.createElement('button'); b.type='button'; b.className='hot'+(canGo?' go':'');
    b.innerHTML=`<i></i><b>${canGo?'Go to ':''}${h.t.replace(/^The /,canGo?'the ':'The ')}</b>`; b.setAttribute('aria-label',(canGo?'Go to '+h.t.replace(/^The /,'the '):'Open '+h.t));
    b.onclick=()=> canGo ? goTo(h.go) : openZone(h.zone); document.body.appendChild(b); return {el:b,p3:h.p3} });
}
async function goTo(id){
  if(here===id) return;
  closePanel(true);
  fade.style.opacity=1; walking=true;
  await new Promise(r=>setTimeout(r,reduce?0:320));
  const st = await build(id);
  if(here) scene.remove(cache[here].mesh);
  scene.add(st.mesh); here=id; t={x:0,y:0}; cur={x:0,y:0}; walking=false; camera.position.z=reduce?0:0.35;
  placeDots(st); hereT.textContent=STANDS[id].title; back.style.display=id==='door'?'none':'inline-flex';
  fade.style.opacity=0;
  // warm the next photos
  Object.keys(STANDS).forEach(k=>{ if(STANDS[k].ready) build(k) });
}
back.onclick=()=>goTo('door');

function size(){ renderer.setSize(innerWidth,innerHeight); camera.aspect=innerWidth/innerHeight; camera.fov=camera.aspect<1?78:62; camera.updateProjectionMatrix() }
addEventListener('resize',size); size();
let last=performance.now();
renderer.setAnimationLoop(now=>{ const dt=Math.min(0.1,(now-last)/1000); last=now; const k=reduce?1:1-Math.exp(-dt*5);
  const open = panel.classList.contains('open') && innerWidth>720;
  const gx=t.x+(drag||reduce?0:hov.x*0.12)+(open?0.35:0), gy=t.y+(drag||reduce?0:hov.y*0.08);
  cur.x+=(gx-cur.x)*k; cur.y+=(gy-cur.y)*k;
  // a short step forward when you walk to the next spot
  const z = camera.position.z + ((walking?-0.45:0)-camera.position.z)*k;
  camera.position.set(cur.x*0.18, 0.02-cur.y*0.06, z);
  camera.rotation.set(-cur.y*0.08-0.04, -cur.x*0.16, 0);
  renderer.render(scene,camera);
  dots.forEach(d=>{ const p=d.p3.clone().project(camera), vis=p.z<1&&Math.abs(p.x)<0.96&&Math.abs(p.y)<0.9; d.el.style.display=vis&&simple.style.display!=='block'?'flex':'none'; if(vis){ d.el.style.left=(p.x+1)/2*innerWidth+'px'; d.el.style.top=(1-p.y)/2*innerHeight+'px' } }) });

// ---------- panels and flows ----------
const panel=document.getElementById('panel'), panelIn=document.getElementById('panelIn'), hint=document.getElementById('hint'), simple=document.getElementById('simple');
const S={mode:'delivery',zip:'97214',day:'Today'};
function whenWhere(first){return `
  <button class="close" aria-label="Close" data-close>×</button>
  ${first?'<p class="lab">Before you step in</p>':''}<p class="q" style="font-size:24px">Where&#39;s it going, and when?</p>
  <p class="muted" style="margin:0;font-size:14px">We only show flowers we can get there in time.</p>
  <div class="seg" role="radiogroup" aria-label="Delivery or pickup"><button role="radio" aria-checked="${S.mode==='delivery'}" data-mode="delivery">Delivery</button><button role="radio" aria-checked="${S.mode==='pickup'}" data-mode="pickup">I&#39;ll pick it up</button></div>
  <label class="f">ZIP code<input id="zip" value="${S.zip}" inputmode="numeric" autocomplete="postal-code"></label>
  <div class="opts" role="radiogroup" aria-label="Day">${[['Today','order by 1 pm'],['Tomorrow','Fri, Nov 13'],['Pick a day','up to 30 days']].map(([a,b])=>`<button class="opt" role="radio" aria-checked="${S.day===a}" data-day="${a}"><b>${a}</b><span>${b}</span></button>`).join('')}</div>
  <button class="btn" data-go>Step inside</button>
  <p class="muted" style="margin:0;font-size:13px">Delivery around Portland is $9. Pickup at the shop is free.</p>`}
const Z={
 counter:()=>`<button class="close" aria-label="Close" data-close>×</button><p class="lab">The counter</p><h2 class="ct" style="font-size:44px">Ask the counter</h2>
  <p style="margin:0">Four questions, the same ones our staff ask: who it&#39;s for, the occasion, the feeling and your budget. Then we show you three bouquets.</p>
  <div class="thumbs"><img src="img/b10-petite-sweet_studio.jpg" alt="Petite sweet"><img src="img/b02-blush-garden_studio.jpg" alt="Blush garden"><img src="img/b09-bright-birthday_studio.jpg" alt="Bright birthday"></div>
  <button class="btn">Start: who&#39;s it for?</button>`,
 cooler:()=>`<button class="close" aria-label="Close" data-close>×</button><p class="lab">The cooler</p><h2 class="ct" style="font-size:44px">Ready bouquets</h2>
  <p style="margin:0">Every bucket is a bouquet you can send today to ${S.zip}. Each one is marked with its real height.</p>
  <div class="thumbs"><img src="img/b02-blush-garden_studio.jpg" alt="Blush garden"><img src="img/b01-red-classic_studio.jpg" alt="Red classic"><img src="img/b04-peach-ranunculus_studio.jpg" alt="Peach ranunculus"></div>
  <button class="btn">See all bouquets</button>`,
 wrap:()=>`<button class="close" aria-label="Close" data-close>×</button><p class="lab">The wrap station</p><h2 class="ct" style="font-size:44px">Build your own</h2>
  <p style="margin:0">Choose each stem from the cooler rail, then the paper and a ribbon from our wall. The preview stands next to a real hand, so the size is never a guess.</p>
  <img src="img/shop_wrap-station.jpg" alt="The ribbon wall at the wrap station" style="width:100%;aspect-ratio:3/2;object-fit:cover;border:1px solid var(--line)">
  <button class="btn">Start building</button>`,
 shelf:()=>`<button class="close" aria-label="Close" data-close>×</button><p class="lab">The shelf</p><h2 class="ct" style="font-size:44px">Vases and extras</h2>
  <p style="margin:0">Add a vase and see your bouquet standing in it at its real size. The shortest is 20 cm and the tallest is 53 cm.</p>
  <button class="btn ghost">Browse vases</button>`,
 door:()=>whenWhere(false),
 cafe:()=>`<button class="close" aria-label="Close" data-close>×</button><p class="lab">The café</p><h2 class="ct" style="font-size:44px">Visit</h2>
  <p style="margin:0">Coffee and pastries from the counter, in the shop only. Collect your order here or choose your flowers in person. Open every day, 8 to 6.</p>
  <img src="img/shop_exterior.jpg" alt="The pink shop front" style="width:100%;aspect-ratio:3/2;object-fit:cover;border:1px solid var(--line)">
  <button class="btn ghost">Plan a visit</button>`};

function show(html){panelIn.innerHTML=html;panel.classList.add('open');hint.style.display='none'}
function closePanel(quiet){panel.classList.remove('open');if(!quiet&&S.set&&simple.style.display!=='block')hint.style.display='flex'}
function openZone(id){ if(Z[id]) show(Z[id]()) }
panel.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.close!==undefined) return closePanel();
  if(t.dataset.mode){S.mode=t.dataset.mode;panelIn.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-checked',b===t))}
  if(t.dataset.day){S.day=t.dataset.day;panelIn.querySelectorAll('[data-day]').forEach(b=>b.setAttribute('aria-checked',b===t))}
  if(t.dataset.go!==undefined){S.zip=(panelIn.querySelector('#zip').value||'97214').trim();S.set=true;document.getElementById('chipText').innerHTML=`${S.mode==='pickup'?'Pickup':S.zip} · ${S.day.toLowerCase()} <span class="full" style="color:#6B5463;text-decoration:underline">change</span>`;closePanel()}});
document.getElementById('chip').addEventListener('click',()=>openZone('door'));
addEventListener('keydown',e=>{if(e.key==='Escape'&&panel.classList.contains('open'))closePanel()});

// ---------- simple view: the same photos, flat ----------
const simpleGrid=document.getElementById('simpleGrid');
const SV=[['counter','Ask the counter','Four questions, three bouquets','stand/stand_03_counter_master.jpg','55% 55%',1.3],['cooler','Shop the cooler','Ready bouquets, real heights','stand/stand_02_cooler_master.jpg','50% 70%',1.5],['wrap','Build your own','Pick every stem, paper and ribbon','stand/stand_04_wrap_master.jpg','80% 50%',1.4],['door','When and where','Delivery or pickup, and the day','stand/stand_01_entrance.jpg','66% 50%',3],['shelf','Vases and extras','Real sizes, next to your bouquet','stand/stand_02_cooler_master.jpg','50% 18%',1.8],['cafe','Visit and café','Open every day, 8 to 6','stand/stand_04_wrap_master.jpg','18% 70%',2]];
simpleGrid.innerHTML=`<div style="grid-column:1/-1;margin-bottom:18px"><p class="q" style="font-size:26px">The same shop, flat.</p></div><div style="grid-column:1/-1" class="rail"></div>`+SV.map(([id,t,s,img,pos,z],i)=>`<div class="cell"><div class="thr" style="height:${[26,52,36,44,30,58][i]}px"></div><div class="hook"></div><article><div class="ph"><img src="${img}" alt="" style="transform:scale(${z});transform-origin:${pos}" loading="lazy"></div><div><h3>${t}</h3><span class="muted" style="font-size:14px">${s}</span><button class="btn ghost" data-open="${id}" style="margin-top:6px">Open</button></div></article></div>`).join('');
simpleGrid.addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)openZone(b.dataset.open)});
const tog=document.getElementById('viewToggle');
function setSimple(on){tog.setAttribute('aria-checked',on);simple.style.display=on?'block':'none';document.getElementById('here').style.display=on?'none':'flex';hint.style.display=(!on&&S.set&&!panel.classList.contains('open'))?'flex':'none'}
tog.addEventListener('click',()=>setSimple(tog.getAttribute('aria-checked')!=='true'));

// first visit: when and where before stepping in; phones start in the simple view
if(innerWidth<720) setSimple(true);
await goTo('door');
show(whenWhere(true));
window.DONE=true;
</script>
</body>
</html>
