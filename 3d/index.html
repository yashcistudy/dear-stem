<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dear stem · the shop</title>
<link rel="icon" href="../vendor/monogram_plum.svg" type="image/svg+xml">
<style>
@font-face{font-family:Jost;font-weight:300;src:url(../vendor/jost-latin-300-normal.woff2) format('woff2')}
@font-face{font-family:Jost;font-weight:400;src:url(../vendor/jost-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Jost;font-weight:500;src:url(../vendor/jost-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Homemade Apple';src:url(../vendor/homemade-apple-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Caffe Latte';src:url(../vendor/caffe-latte.woff2) format('woff2')}
:root{--paper:#FBF8F3;--plum:#3A2233;--ink2:#6B5463;--petal:#F1B9C4;--butter:#F2D98B;--lilac:#C3B3E0;--blue:#7E9CCB;--mint:#BFD8C2;--line:rgba(58,34,51,.16)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--plum);font-family:Jost,sans-serif;overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
#stage{position:fixed;inset:0}
canvas{display:block}
header{position:fixed;left:0;right:0;top:0;z-index:5;background:var(--paper)}
.rail{height:10px;background:url(../vendor/rail.svg) center/100% 100% no-repeat}
.rule{height:6px;background:url(../vendor/rule.svg) center/100% 100% no-repeat}
.thr{width:8px;background:url(../vendor/thread.svg) center/100% 100% no-repeat}
.hook{width:20px;height:26px;background:url(../vendor/hook.svg) center top/contain no-repeat}
.frame{border:7px solid transparent;border-image:url(../vendor/box.svg) 9 stretch}
.hd{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:6px 28px 6px}
.hd img{height:44px;display:block}
.hd .right{display:flex;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--plum);padding:8px 12px;min-height:44px;font-size:14px}
.toggle{display:inline-flex;align-items:center;gap:10px;background:transparent;border:0;font-size:14px;min-height:44px}
.sw{width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--paper);transition:left .2s}
.toggle[aria-checked=true] .sw{background:var(--plum)}
.toggle[aria-checked=true] .sw::after{left:21px}
.btn{background:var(--plum);color:var(--paper);border:1.5px solid var(--plum);font-weight:500;font-size:16px;min-height:50px;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--paper);color:var(--plum)}
.q{font-family:'Homemade Apple',cursive;line-height:1.5;margin:0}
.ct{font-family:'Caffe Latte',serif;font-weight:400;margin:0;line-height:1.05;white-space:nowrap}
.lab{font-size:13px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;margin:0}
.muted{color:var(--ink2)}
/* side panel */
#panel{position:fixed;z-index:6;top:96px;right:24px;width:400px;height:auto;max-height:calc(100% - 130px);overflow:auto;background:transparent;padding:0;transform:translateX(440px);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#panel.open{transform:none}
#panel .tie{display:flex;flex-direction:column;align-items:center;position:absolute;left:50%;top:-58px;margin-left:-10px}
#panel .in{position:relative;padding:22px 24px 24px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);background:var(--paper)}
#panel .close{position:absolute;right:10px;top:8px;border:0;background:transparent;font-size:26px;width:44px;height:44px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{background:#fff;border:1px solid var(--line);min-height:62px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:2px}
.opt[aria-checked=true]{background:var(--petal);border:7px solid transparent;border-image:url(../vendor/box.svg) 9 stretch;padding:2px}
.opt b{font-weight:500;font-size:15px}.opt span{font-size:12px;color:var(--ink2)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--plum)}
.seg button{border:0;min-height:46px;background:#fff;font-size:15px}
.seg button[aria-checked=true]{background:var(--plum);color:var(--paper);font-weight:500}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
label.f input{font-family:inherit;font-size:17px;color:var(--plum);background:#fff;border:1px solid var(--plum);padding:10px 12px;min-height:48px}
.thumbs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.thumbs img{width:100%;aspect-ratio:4/5;object-fit:cover;border:1px solid var(--line);display:block}
/* hint + tag */
#hint{position:fixed;z-index:4;left:50%;bottom:26px;transform:translateX(-50%);background:var(--paper);border:1px solid var(--plum);padding:10px 16px;font-size:15px;display:none;align-items:center;gap:10px}
#tag{position:fixed;z-index:4;pointer-events:none;display:none;flex-direction:column;align-items:center}
#tag .t{background:var(--paper);border:1px solid var(--plum);padding:10px 14px;margin-top:-12px;text-align:center;min-width:150px}
#tag .t b{display:block;font-weight:500;font-size:16px}
#tag .t span{font-size:13px;color:var(--ink2)}
/* simple view */
#simple{position:fixed;inset:0;z-index:3;overflow:auto;background:var(--paper);padding:110px 28px 60px;display:none}
#simple .grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 20px}
#simple .cell{display:flex;flex-direction:column;align-items:center}
#simple article{background:#fff;border:1px solid var(--line);width:100%;margin-top:-12px;text-align:left}
#simple article img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
#simple article div{padding:14px 16px 18px;display:flex;flex-direction:column;gap:6px}
#simple h3{margin:0;font-size:18px;font-weight:500}
#credits{position:fixed;z-index:4;left:20px;bottom:16px;font-size:12px;color:var(--ink2);background:rgba(251,248,243,.85);padding:4px 8px}
#credits a{color:var(--plum)}
@media (max-width:720px){
 .hd{padding:6px 14px}.hd img{height:34px}.chip .full{display:none}
 #panel{left:10px;right:10px;width:auto;top:auto;bottom:10px;max-height:72%;transform:translateY(110%)}
 #panel.open{transform:none}
 #simple{padding:96px 16px 40px}#simple .grid{grid-template-columns:1fr}
 .opts{grid-template-columns:repeat(3,1fr)}
}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}
ul.credits{margin:0;padding-left:18px;font-size:13px;line-height:1.55}ul.credits a{color:var(--plum,#3A2233)}
</style>
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js","three/addons/":"../vendor/addons/"}}</script>
</head>
<body>
<header>
 <div class="rail"></div>
 <div class="hd">
  <img src="../vendor/logo-one-line_plum.svg" alt="dear stem">
  <div class="right">
   <button class="chip" id="chip" type="button"><span aria-hidden="true">⌖</span><span id="chipText">where to?</span></button>
   <button class="toggle" id="viewToggle" role="switch" aria-checked="false" type="button"><span class="sw" aria-hidden="true"></span><span>Simple view</span></button>
  </div>
 </div>
 <div class="rule"></div>
</header>
<div id="stage" aria-label="The dear stem shop in 3D. Choose an area from the shop or switch to the simple view."></div>
<div id="tag" aria-hidden="true"><div class="thr" style="height:46px"></div><div class="hook"></div><div class="t"><b id="tagT"></b><span id="tagS"></span></div></div>
<div id="hint"><span class="q" style="font-size:15px">Tap anything in the shop.</span></div>
<aside id="panel" aria-live="polite"><div class="tie"><div class="thr" style="height:44px"></div><div class="hook"></div></div><div class="in" id="panelIn"></div></aside>
<section id="simple" aria-label="Simple view"><div class="grid" id="simpleGrid"></div></section>
<div id="credits"><span id="loadT">Setting up the shop</span> <a href="#" id="creditLink">Credits</a></div>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RGBELoader} from 'three/addons/loaders/RGBELoader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
const C = {paper:0xFBF8F3, plum:0x3A2233, petal:0xF1B9C4, butter:0xF2D98B, lilac:0xC3B3E0, blue:0x7E9CCB, mint:0xBFD8C2, wall:0xE9AFBA, wallDark:0xE3A7B3, wood:0xC8A27C};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.localClippingEnabled = true; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(C.paper);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.05, 60);
const HOME = {pos:new THREE.Vector3(0,1.75,5.1), look:new THREE.Vector3(0,1.45,-2.4)};
camera.position.copy(HOME.pos);
let camTarget = {pos:HOME.pos.clone(), look:HOME.look.clone()}, look = HOME.look.clone();

// ---------- helpers ----------
const M = (c, o={}) => new THREE.MeshStandardMaterial(Object.assign({color:c, roughness:.85, metalness:0}, o));
function box(w,h,d,mat,x,y,z,parent=scene){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;parent.add(m);return m}
function cyl(rt,rb,h,mat,x,y,z,parent=scene,seg=32){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;parent.add(m);return m}
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;return t}
function tile(){return canvasTex(256,256,(g,w,h)=>{g.fillStyle='#EADFCF';g.fillRect(0,0,w,h);g.fillStyle='#DCCAB2';g.fillRect(0,0,w/2,h/2);g.fillRect(w/2,h/2,w/2,h/2);g.strokeStyle='rgba(58,34,51,.08)';g.lineWidth=2;g.strokeRect(0,0,w,h);g.strokeRect(0,0,w/2,h/2)})}

// ---------- room: 8 m wide, 5.4 m deep, 3.3 m high ----------
const W=8, D=5.4, H=3.3;
const floorT = tile(); floorT.wrapS=floorT.wrapT=THREE.RepeatWrapping; floorT.repeat.set(10,7);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(W,D+1.4), M(0xffffff,{map:floorT,roughness:.7})); floor.rotation.x=-Math.PI/2; floor.position.set(0,0,-D/2+0.7); floor.receiveShadow=true; scene.add(floor);
const wallM = M(C.wall,{roughness:.95}), wallM2 = M(C.wallDark,{roughness:.95});
const back = new THREE.Mesh(new THREE.PlaneGeometry(W,H), wallM); back.position.set(0,H/2,-D); back.receiveShadow=true; scene.add(back);
const left = new THREE.Mesh(new THREE.PlaneGeometry(D+1.4,H), wallM2); left.rotation.y=Math.PI/2; left.position.set(-W/2,H/2,-D/2+0.7); left.receiveShadow=true; scene.add(left);
const right = left.clone(); right.rotation.y=-Math.PI/2; right.position.x=W/2; scene.add(right);
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(W,D+1.4), M(C.paper,{emissive:0xF3E6DA,emissiveIntensity:.55})); ceil.rotation.x=Math.PI/2; ceil.position.set(0,H,-D/2+0.7); scene.add(ceil);
// paper skirting and a plum picture rail, like the brand's rail
const skirtM = M(C.paper), railM = M(C.plum,{roughness:.6});
box(W,0.14,0.03,skirtM,0,0.07,-D+0.015); box(0.03,0.14,D+1.4,skirtM,-W/2+0.015,0.07,-D/2+0.7); box(0.03,0.14,D+1.4,skirtM,W/2-0.015,0.07,-D/2+0.7);
box(W,0.03,0.03,railM,0,H-0.25,-D+0.02);

// ---------- lights ----------
const hemi=new THREE.HemisphereLight(0xFFF3EA, 0xC79A86, 0.9); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xFFE6CC, 2.2); sun.position.set(5,6,3); sun.castShadow=true; sun.shadow.mapSize.set(1536,1536);
Object.assign(sun.shadow.camera,{left:-6,right:6,top:6,bottom:-6,near:1,far:20}); sun.shadow.bias=-0.0004; sun.shadow.radius=4; scene.add(sun);
const fill = new THREE.DirectionalLight(0xFFEFE6, 0.7); fill.position.set(-5,3.5,2); scene.add(fill);
const warm = new THREE.PointLight(0xFFD2B0, 10, 9, 2); warm.position.set(0,2.8,-2.2); scene.add(warm);

const STAND={cooler:[],pastry:[]};
const woodM = M(C.wood,{roughness:.55});
// ---------- the zones ----------
const zones = []; const hit = [];
function zone(id, title, sub, group, cam, hitSize, hitPos){
  const hb = new THREE.Mesh(new THREE.BoxGeometry(...hitSize), new THREE.MeshBasicMaterial({visible:false}));
  hb.position.copy(hitPos); hb.userData.zone = id; scene.add(hb); hit.push(hb);
  const z = {id, title, sub, group, cam, hb}; zones.push(z); return z;
}

// sign on the back wall: logo + red hand-painted line, like her shop
const logoImg = new Image(); logoImg.src = '../vendor/logo-one-line_plum.svg';
const signM = new THREE.MeshBasicMaterial({transparent:true});
const sign = new THREE.Mesh(new THREE.PlaneGeometry(2.4,0.6), signM); sign.position.set(0,2.62,-D+0.02); scene.add(sign);
logoImg.onload = () => { signM.map = canvasTex(1600,400,(g,w,h)=>{g.clearRect(0,0,w,h);const r=logoImg.width/logoImg.height;const lh=300;g.drawImage(logoImg,(w-lh*r)/2,40,lh*r,lh)}); signM.needsUpdate=true; };

// counter (center back)
const counter = new THREE.Group(); scene.add(counter);
box(2.4,0.98,0.66,M(C.paper,{roughness:.6}),0,0.49,-3.6,counter);
box(2.5,0.05,0.74,M(C.plum,{roughness:.45}),0,1.0,-3.6,counter);
for(let i=0;i<6;i++) box(0.012,0.84,0.005,M(C.wallDark),-1.05+i*0.42,0.5,-3.265,counter);
const glass = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.36,0.5), new THREE.MeshPhysicalMaterial({color:0xffffff,transmission:.9,roughness:.05,thickness:.02,transparent:true,opacity:.35}));
glass.position.set(-0.55,1.21,-3.62); counter.add(glass);
for(let i=0;i<5;i++){const p=new THREE.Mesh(new THREE.TorusGeometry(0.045,0.022,10,20),M(i%2?0xE7C27D:0xD9A35E,{roughness:.7}));p.rotation.x=Math.PI/2;p.position.set(-0.85+i*0.15,1.08,-3.6);p.castShadow=true;counter.add(p);STAND.pastry.push(p)}
const easelT = canvasTex(512,640,(g,w,h)=>{g.fillStyle='#FBF8F3';g.fillRect(0,0,w,h);g.strokeStyle='#3A2233';g.lineWidth=6;g.strokeRect(14,14,w-28,h-28);g.fillStyle='#3A2233';g.textAlign='center';g.font="54px 'Homemade Apple'";g.fillText('Ask the',w/2,250);g.fillText('counter',w/2,350);g.font="30px Jost";g.fillText('4 questions',w/2,470)});
const easel = new THREE.Mesh(new THREE.PlaneGeometry(0.32,0.4), new THREE.MeshStandardMaterial({map:easelT,roughness:.9})); easel.position.set(0.55,1.23,-3.55); easel.rotation.x=-0.18; counter.add(easel);
zone('counter','Ask the counter','Four questions, three bouquets',counter,{pos:new THREE.Vector3(0.2,1.55,-1.6),look:new THREE.Vector3(0,1.15,-3.6)},[2.6,1.6,1],new THREE.Vector3(0,0.8,-3.6));

// cooler buckets (front left) with stand-in bouquets in the brand colours
const cooler = new THREE.Group(); scene.add(cooler);
const steel = M(0xC3C9CE,{metalness:.75,roughness:.32}), water = M(0x2E3A3A,{roughness:.15});
const palettes = [[0xF1B9C4,0xFBF8F3,0xE38FA2],[0xC0303F,0xA82332,0xD8434F],[0xF4B183,0xF7C9A4,0xFBF8F3],[0xFBF8F3,0xEDE7DF,0xC3B3E0],[0xF2D98B,0xE8B94A,0xFBF8F3],[0xF29AA8,0xF2D98B,0x7E9CCB]];
box(1.9,0.42,0.9,M(C.plum,{roughness:.6}),-2.75,0.21,-1.15,cooler);
palettes.forEach((pal,i)=>{const x=-3.35+(i%3)*0.6, z=-1.42+Math.floor(i/3)*0.55;
  const bk=new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.13,0.38,32,1,true),steel); bk.material.side=THREE.DoubleSide; bk.position.set(x,0.61,z); bk.castShadow=bk.receiveShadow=true; cooler.add(bk);
  const rim=new THREE.Mesh(new THREE.TorusGeometry(0.17,0.008,8,40),steel); rim.rotation.x=Math.PI/2; rim.position.set(x,0.8,z); cooler.add(rim); cyl(0.16,0.16,0.005,water,x,0.74,z,cooler);
  const g=new THREE.Group(); g.position.set(x,0.8,z); cooler.add(g); STAND.cooler.push(g);
  for(let s=0;s<14;s++){const a=s/14*Math.PI*2+i, r=0.03+Math.random()*0.09; const st=cyl(0.004,0.004,0.32,M(0x5E7D4F),Math.cos(a)*r*0.5,0.12,Math.sin(a)*r*0.5,g,6); st.rotation.z=Math.cos(a)*0.25; st.rotation.x=Math.sin(a)*0.25;
    const head=new THREE.Mesh(new THREE.SphereGeometry(0.035+Math.random()*0.02,12,10),M(pal[s%3],{roughness:.8})); head.position.set(Math.cos(a)*r,0.3+Math.random()*0.06,Math.sin(a)*r); head.castShadow=true; g.add(head)}
});
zone('cooler','Shop the cooler','Ready bouquets, real heights',cooler,{pos:new THREE.Vector3(-1.5,1.5,0.9),look:new THREE.Vector3(-2.8,0.8,-1.2)},[2.1,1.4,1.1],new THREE.Vector3(-2.75,0.7,-1.15));

// vase shelf (back left), vases at their real Poly Haven heights
const shelf = new THREE.Group(); scene.add(shelf);
const blk = M(0x2B2B2B,{metalness:.6,roughness:.4});
[[-3.6],[-2.0]].forEach(([x])=>{box(0.03,2.1,0.03,blk,x,1.05,-D+0.08,shelf);box(0.03,2.1,0.03,blk,x,1.05,-D+0.42,shelf)});
const vases = [[0.205,0.401,0xEFE6D8],[0.22,0.309,0xC9876A],[0.112,0.414,0xF4F1EC],[0.183,0.342,0x9FB4A2],[0.255,0.44,0x7E9CCB],[0.21,0.529,0xC2A15A],[0.083,0.2,0xC2A15A]];
[0.35,1.0,1.65].forEach((y,row)=>{box(1.65,0.03,0.4,M(0xE9E2D8,{roughness:.7}),-2.8,y,-D+0.25,shelf)});
vases.forEach(([wd,ht,col],i)=>{const row=i<3?0:(i<5?1:2); const y=[0.365,1.015,1.665][row]; const x=-3.35+[0,0.55,1.1,0.2,0.85,0.25,0.8][i];
  const pts=[];for(let k=0;k<=12;k++){const t=k/12; const r=wd/2*(0.55+0.45*Math.sin(Math.PI*(0.15+t*0.8)))*(t>0.9?0.75:1); pts.push(new THREE.Vector2(Math.max(r,0.02),t*ht))}
  const v=new THREE.Mesh(new THREE.LatheGeometry(pts,32),M(col,{roughness:col===0xC2A15A?.35:.55,metalness:col===0xC2A15A?.7:0,side:THREE.DoubleSide})); v.position.set(x,y,-D+0.25); v.castShadow=true; shelf.add(v)});
zone('shelf','Vases and extras','Real sizes, next to your bouquet',shelf,{pos:new THREE.Vector3(-1.4,1.45,-1.9),look:new THREE.Vector3(-2.8,1.05,-D+0.2)},[1.9,2.2,0.6],new THREE.Vector3(-2.8,1.05,-D+0.3));

// wrap station + ribbon wall (right wall)
const wrap = new THREE.Group(); scene.add(wrap);
box(0.85,0.9,1.7,M(C.paper,{roughness:.6}),W/2-0.6,0.45,-2.9,wrap);
box(0.95,0.04,1.8,woodM,W/2-0.6,0.92,-2.9,wrap);
const ribbonCols=[C.petal,C.butter,C.lilac,C.blue,C.mint,C.plum,0xE38FA2,0xFBF8F3];
for(let r=0;r<3;r++){box(0.12,0.02,1.6,woodM,W/2-0.07,1.45+r*0.36,-2.9,wrap);

// ---------- loop ----------
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;
  camera.fov = camera.aspect<1 ? 62 : 42; camera.updateProjectionMatrix()}
addEventListener('resize',resize); resize();
const clock=new THREE.Clock(); const SHIFT=new THREE.Vector3();
function updShift(){ if(!active) return; const dir=active.cam.look.clone().sub(active.cam.pos).normalize(); const rightV=new THREE.Vector3().crossVectors(dir,new THREE.Vector3(0,1,0)).normalize(); SHIFT.copy(rightV.multiplyScalar(0.55)); }
setInterval(updShift,100);
let last=0; renderer.setAnimationLoop(()=>{const t=clock.getElapsedTime(); const dt=Math.min(t-last,0.1); last=t; const k=reduce?1:1-Math.exp(-dt*3.2);
  if(!reduce) hung.forEach(h=>{h.pivot.rotation.z=Math.sin(t*0.7+h.ph)*h.amp;h.pivot.rotation.x=Math.cos(t*0.55+h.ph)*h.amp*0.7});
  const p = active?{x:0,y:0}:par; const shift = (active&&innerWidth>720)?SHIFT.clone():new THREE.Vector3();
  const tp=camTarget.pos.clone().add(new THREE.Vector3(p.x*0.18,p.y*0.08,0)).add(shift);
  camera.position.lerp(tp, k); look.lerp(camTarget.look.clone().add(shift), k); camera.lookAt(look);
  renderer.render(scene,camera)});

// first visit: ask when and where before stepping in; phones start in the simple view
if(innerWidth<720) setSimple(true);
if(!location.hash.startsWith('#shot')) show(whenWhere(true));
window.__ready=true;
{let ok=0; const iv=setInterval(()=>{ ok = (used.size&&nDone===used.size) ? ok+1 : 0; if(ok>=4){ clearInterval(iv); if(location.hash.startsWith('#shot')){ renderer.setAnimationLoop(null); const v=location.hash.split('=')[1]; if(v&&zones.find(z=>z.id===v)){ const z=zones.find(z=>z.id===v); camera.position.copy(z.cam.pos); camera.lookAt(z.cam.look) } else { camera.position.copy(HOME.pos); camera.lookAt(HOME.look) } renderer.render(scene,camera) } window.DONE=true } },500)}
