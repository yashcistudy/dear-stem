<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dear stem · 360 test</title>
<link rel="icon" href="../vendor/monogram_plum.svg" type="image/svg+xml">
<style>
@font-face{font-family:Jost;src:url(../vendor/jost-latin-400-normal.woff2) format('woff2');font-weight:400}
@font-face{font-family:Jost;src:url(../vendor/jost-latin-500-normal.woff2) format('woff2');font-weight:500}
html,body{margin:0;height:100%;overflow:hidden;background:#FBF8F3;font-family:Jost,system-ui,sans-serif;color:#3A2233}
canvas{display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
.bar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:#FBF8F3;border-bottom:1px solid rgba(58,34,51,.25);z-index:5}
.bar img{height:30px}.bar span{font-size:14px;color:#6B5463}
.hot{position:fixed;z-index:4;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;font:inherit;color:#3A2233}
.hot i{width:18px;height:18px;border-radius:50%;background:#FBF8F3;border:2px solid #3A2233;box-shadow:0 0 0 6px rgba(251,248,243,.45)}
.hot b{font-weight:500;font-size:14px;background:#FBF8F3;padding:5px 10px;border:1px solid #3A2233}
.panel{position:fixed;right:20px;top:80px;width:min(360px,calc(100% - 40px));background:#FBF8F3;border:1px solid #3A2233;padding:22px;z-index:6;display:none}
.panel p.q{font-family:Jost,sans-serif;font-size:22px;margin:0 0 10px}
.panel button{margin-top:14px;background:#3A2233;color:#FBF8F3;border:0;padding:12px 16px;font:inherit;cursor:pointer}
.tip{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#FBF8F3;border:1px solid rgba(58,34,51,.3);padding:8px 14px;font-size:14px;z-index:4}
</style>
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js"}}</script>
</head>
<body>
<div class="bar"><img src="../vendor/logo-one-line_plum.svg" alt="dear stem"><span>360 test · <a href="../" style="color:inherit">back to the 3D shop</a></span></div>
<div class="tip" id="tip">Drag to look around</div>
<div class="panel" id="panel"><p class="q" id="pq"></p><p id="pt" style="margin:0"></p><button id="pc">Close</button></div>
<script type="module">
import * as THREE from 'three';
const r=new THREE.WebGLRenderer({antialias:true}); r.setPixelRatio(Math.min(devicePixelRatio,2)); r.outputColorSpace=THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const scene=new THREE.Scene(), cam=new THREE.PerspectiveCamera(70,1,0.1,100);
const geo=new THREE.SphereGeometry(10,96,64); geo.scale(-1,1,1);
const tex=new THREE.TextureLoader().load('skybox-test-01.jpg'); tex.colorSpace=THREE.SRGBColorSpace; tex.anisotropy=8;
scene.add(new THREE.Mesh(geo,new THREE.MeshBasicMaterial({map:tex})));
// a point in the panorama (u,v from 0 to 1) as a direction
const dir=(u,v)=>new THREE.Vector3(Math.cos(2*Math.PI*u)*Math.sin(Math.PI*v),Math.cos(Math.PI*v),Math.sin(2*Math.PI*u)*Math.sin(Math.PI*v));
// look: yaw follows u, pitch is kept between -28 and 22 degrees so the warped ceiling and floor centre stay out of view
let yaw=2*Math.PI*0.45, pitch=-0.12, vy=0;
const MINP=-0.49, MAXP=0.38;
function look(){ const d=new THREE.Vector3(Math.cos(yaw)*Math.cos(pitch),Math.sin(pitch),Math.sin(yaw)*Math.cos(pitch)); cam.lookAt(d) }
let drag=null; const el=r.domElement;
el.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};el.setPointerCapture(e.pointerId);document.getElementById('tip').style.display='none'});
el.addEventListener('pointermove',e=>{ if(!drag) return; const k=cam.fov/innerHeight*Math.PI/180; vy=(e.clientX-drag.x)*k; yaw+=vy; pitch=Math.min(MAXP,Math.max(MINP,pitch+(e.clientY-drag.y)*k)); drag={x:e.clientX,y:e.clientY} });
el.addEventListener('pointerup',()=>drag=null);
el.addEventListener('wheel',e=>{ cam.fov=Math.min(80,Math.max(45,cam.fov+e.deltaY*0.03)); cam.updateProjectionMatrix() },{passive:true});
addEventListener('keydown',e=>{ if(e.key==='ArrowLeft') yaw-=0.08; if(e.key==='ArrowRight') yaw+=0.08 });
// two working hotspots
const HOTS=[{u:0.41,v:0.6,t:'Ask the counter',q:'Who is it for?',p:'Four questions, then three bouquets we would make for them.'},
            {u:0.505,v:0.66,t:'The cooler',q:'Ready today',p:'Every bucket is a bouquet you can send today, with its real height.'},
            {u:0.715,v:0.6,t:'The café',q:'Come in',p:'Coffee and pastries, open every day, 8 to 6.'}];
const panel=document.getElementById('panel');
HOTS.forEach(h=>{ h.d=dir(h.u,h.v).multiplyScalar(5); const b=document.createElement('button'); b.className='hot'; b.innerHTML=`<i></i><b>${h.t}</b>`; b.onclick=()=>{ document.getElementById('pq').textContent=h.q; document.getElementById('pt').textContent=h.p; panel.style.display='block' }; document.body.appendChild(b); h.el=b });
document.getElementById('pc').onclick=()=>panel.style.display='none';
function size(){ r.setSize(innerWidth,innerHeight); cam.aspect=innerWidth/innerHeight; cam.fov=innerWidth<720?80:70; cam.updateProjectionMatrix() }
addEventListener('resize',size); size();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
r.setAnimationLoop(()=>{ if(!drag&&!reduce){ vy*=0.92; yaw+=vy } look(); r.render(scene,cam);
  HOTS.forEach(h=>{ const p=h.d.clone().project(cam), vis=p.z<1&&Math.abs(p.x)<1.1&&Math.abs(p.y)<1.1; h.el.style.display=vis?'flex':'none'; if(vis){ h.el.style.left=(p.x+1)/2*innerWidth+'px'; h.el.style.top=(1-p.y)/2*innerHeight+'px' } }) });
</script>
</body>
</html>
