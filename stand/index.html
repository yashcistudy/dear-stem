<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dear stem · standpoint test</title>
<link rel="icon" href="../vendor/monogram_plum.svg" type="image/svg+xml">
<style>
@font-face{font-family:Jost;src:url(../vendor/jost-latin-400-normal.woff2) format('woff2');font-weight:400}
@font-face{font-family:Jost;src:url(../vendor/jost-latin-500-normal.woff2) format('woff2');font-weight:500}
html,body{margin:0;height:100%;overflow:hidden;background:#FBF8F3;font-family:Jost,system-ui,sans-serif;color:#3A2233}
canvas{display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
.bar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:#FBF8F3;border-bottom:1px solid rgba(58,34,51,.25);z-index:5}
.bar img{height:30px}.bar span{font-size:14px;color:#6B5463}.bar a{color:inherit}
.hot{position:fixed;z-index:4;transform:translate(-9px,-50%);display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer;font:inherit;color:#3A2233}
.hot i{width:14px;height:14px;border-radius:50%;background:#FBF8F3;border:2px solid #3A2233;box-shadow:0 0 0 5px rgba(251,248,243,.5)}
.hot b{font-weight:500;font-size:14px;background:#FBF8F3;padding:5px 10px;border:1px solid #3A2233;opacity:0;transform:translateX(-4px);transition:.2s}
.hot:hover b,.hot:focus-visible b,body.touch .hot b{opacity:1;transform:none}
.panel{position:fixed;right:20px;top:80px;width:min(360px,calc(100% - 40px));background:#FBF8F3;border:1px solid #3A2233;padding:22px;z-index:6;display:none}
.panel p.q{font-family:Jost,sans-serif;font-size:22px;margin:0 0 10px}
.panel button{margin-top:14px;background:#3A2233;color:#FBF8F3;border:0;padding:12px 16px;font:inherit;cursor:pointer}
.tip{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#FBF8F3;border:1px solid rgba(58,34,51,.3);padding:8px 14px;font-size:14px;z-index:4}
.tog{position:fixed;bottom:18px;right:18px;z-index:4;background:#FBF8F3;border:1px solid rgba(58,34,51,.3);padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;color:#3A2233}
</style>
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js"}}</script>
</head>
<body>
<div class="bar"><img src="../vendor/logo-one-line_plum.svg" alt="dear stem"><span>standpoint test · <a href="../360/">360 test</a> · <a href="../">3D shop</a></span></div>
<div class="tip" id="tip">Drag to look around</div>
<button class="tog" id="tog">Depth on</button>
<div class="panel" id="panel"><p class="q" id="pq"></p><p id="pt" style="margin:0"></p><button id="pc">Close</button></div>
<script type="module">
import * as THREE from 'three';
if(matchMedia('(hover:none)').matches) document.body.classList.add('touch');
const r=new THREE.WebGLRenderer({antialias:true}); r.setPixelRatio(Math.min(devicePixelRatio,2)); r.outputColorSpace=THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xFBF8F3);
const cam=new THREE.PerspectiveCamera(60,1,0.05,50);
// the photo was taken with a very wide lens: about 112 degrees across
const HF=112*Math.PI/180, TH=Math.tan(HF/2), TV=TH/1.5;
const load=src=>new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.src=src});
const [photo,depthImg]=await Promise.all([load('stand_01_entrance.jpg'),load('stand_01_depth.png')]);
const dc=document.createElement('canvas'); dc.width=depthImg.width; dc.height=depthImg.height; const dg=dc.getContext('2d'); dg.drawImage(depthImg,0,0); const dd=dg.getImageData(0,0,dc.width,dc.height).data;
const depthAt=(u,v)=>{ const x=Math.min(dc.width-1,Math.max(0,Math.round(u*(dc.width-1)))), y=Math.min(dc.height-1,Math.max(0,Math.round(v*(dc.height-1)))); return dd[(y*dc.width+x)*4]/255 };
let depthOn=true;
// white = near (1.4 m), black = far (about 7 m)
const dist=(u,v)=>depthOn?1.4+Math.pow(1-depthAt(u,v),1.15)*5.6:4.2;
const point=(u,v)=>{ const d=dist(u,v); return new THREE.Vector3((u*2-1)*TH*d,(1-2*v)*TV*d,-d) };
const SX=240, SY=160, geo=new THREE.PlaneGeometry(1,1,SX,SY);
function shape(){ const p=geo.attributes.position, uv=geo.attributes.uv; for(let i=0;i<p.count;i++){ const u=uv.getX(i), v=1-uv.getY(i); const q=point(u,v); p.setXYZ(i,q.x,q.y,q.z) } p.needsUpdate=true; geo.computeBoundingSphere() }
shape();
const tex=new THREE.Texture(photo); tex.colorSpace=THREE.SRGBColorSpace; tex.anisotropy=8; tex.needsUpdate=true;
scene.add(new THREE.Mesh(geo,new THREE.MeshBasicMaterial({map:tex})));
// drag moves your head a little and turns it the other way, as if you leaned to look past something
let t={x:0,y:0}, cur={x:0,y:0}, hov={x:0,y:0}, drag=null;
const el=r.domElement;
el.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};el.setPointerCapture(e.pointerId);document.getElementById('tip').style.display='none'});
el.addEventListener('pointermove',e=>{ hov.x=e.clientX/innerWidth*2-1; hov.y=e.clientY/innerHeight*2-1; if(!drag) return;
  t.x=Math.max(-1,Math.min(1,t.x-(e.clientX-drag.x)/innerWidth*2.2)); t.y=Math.max(-1,Math.min(1,t.y-(e.clientY-drag.y)/innerHeight*2)); drag={x:e.clientX,y:e.clientY} });
el.addEventListener('pointerup',()=>drag=null);
addEventListener('keydown',e=>{ if(e.key==='ArrowLeft') t.x=Math.max(-1,t.x-0.15); if(e.key==='ArrowRight') t.x=Math.min(1,t.x+0.15) });
const HOTS=[{u:0.2,v:0.66,t:'The cooler',q:'Ready today',p:'Every bucket is a bouquet you can send today, with its real height.'},
            {u:0.47,v:0.5,t:'Ask the counter',q:'Who is it for?',p:'Four questions, then three bouquets we would make for them.'},
            {u:0.86,v:0.36,t:'Build your own',q:'Pick every stem',p:'Choose the stems, the paper and a ribbon. It is shown next to a real hand, so the size is never a guess.'},
            {u:0.65,v:0.5,t:'When and where',q:'Where is it going?',p:'Delivery or pickup, and the day.'},
            {u:0.76,v:0.66,t:'The café',q:'Come in',p:'Coffee and pastries, open every day, 8 to 6.'}];
const panel=document.getElementById('panel');
HOTS.forEach(h=>{ const b=document.createElement('button'); b.className='hot'; b.setAttribute('aria-label',h.t); b.innerHTML=`<i></i><b>${h.t}</b>`; b.onclick=()=>{ document.getElementById('pq').textContent=h.q; document.getElementById('pt').textContent=h.p; panel.style.display='block' }; document.body.appendChild(b); h.el=b; h.p3=point(h.u,h.v) });
document.getElementById('pc').onclick=()=>panel.style.display='none';
document.getElementById('tog').onclick=e=>{ depthOn=!depthOn; e.target.textContent=depthOn?'Depth on':'Depth off'; shape(); HOTS.forEach(h=>h.p3=point(h.u,h.v)) };
function size(){ r.setSize(innerWidth,innerHeight); cam.aspect=innerWidth/innerHeight; cam.fov=cam.aspect<1?78:62; cam.updateProjectionMatrix() }
addEventListener('resize',size); size();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches; let last=performance.now();
r.setAnimationLoop(now=>{ const dt=Math.min(0.1,(now-last)/1000); last=now; const k=reduce?1:1-Math.exp(-dt*5);
  const gx=t.x+(drag||reduce?0:hov.x*0.12), gy=t.y+(drag||reduce?0:hov.y*0.08);
  cur.x+=(gx-cur.x)*k; cur.y+=(gy-cur.y)*k;
  cam.position.set(cur.x*0.18, 0.02-cur.y*0.06, 0);
  cam.rotation.set(-cur.y*0.08-0.04, -cur.x*0.16, 0);
  r.render(scene,cam);
  HOTS.forEach(h=>{ const p=h.p3.clone().project(cam), vis=p.z<1&&Math.abs(p.x)<1&&Math.abs(p.y)<1; h.el.style.display=vis?'flex':'none'; if(vis){ h.el.style.left=(p.x+1)/2*innerWidth+'px'; h.el.style.top=(1-p.y)/2*innerHeight+'px' } }) });
window.DONE=true;
</script>
</body>
</html>
